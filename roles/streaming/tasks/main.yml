---
- name: Installer ffmpeg
  apt:
    name: ffmpeg
    state: present
    update_cache: yes

- name: Creer le dossier des videos
  file:
    path: /videos
    state: directory
    mode: "0755"

- name: Generer une video de test avec ffmpeg, sans dependance a une source externe
  ansible.builtin.command:
    cmd: ffmpeg -f lavfi -i testsrc=duration=60:size=640x480:rate=30 -f lavfi -i sine=frequency=1000:duration=60 -c:v libx264 -c:a aac -shortest /videos/sample.mp4
    creates: /videos/sample.mp4

- name: Deployer le service systemd de streaming
  template:
    src: streamer.service.j2
    dest: /etc/systemd/system/streamer.service

- name: Activer et demarrer le service
  systemd:
    name: streamer
    state: started
    enabled: yes
    daemon_reload: yes
